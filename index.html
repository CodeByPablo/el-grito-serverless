<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡El Grito Automático! - AWS Serverless</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mexico: { green: '#006847', red: '#CE1126', white: '#FFFFFF' }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(0,104,71,0.05) 0%, rgba(255,255,255,1) 50%, rgba(206,17,38,0.05) 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .btn-grito {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, #CE1126, #a80e1f);
            box-shadow: 0 10px 25px -5px rgba(206, 17, 38, 0.5);
        }

        .btn-grito:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 30px -5px rgba(206, 17, 38, 0.6);
        }

        .btn-grito:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 10px -5px rgba(206, 17, 38, 0.5);
        }

        #toast {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 font-sans text-gray-800">

    <main class="glass-card w-full max-w-lg rounded-3xl p-8 md:p-12 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-3 flex">
            <div class="h-full w-1/3 bg-mexico-green"></div>
            <div class="h-full w-1/3 bg-mexico-white"></div>
            <div class="h-full w-1/3 bg-mexico-red"></div>
        </div>

        <div class="mt-4 mb-8">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-2">15 de Septiembre</h2>
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">
                ¡Viva <span class="text-transparent bg-clip-text bg-gradient-to-r from-mexico-green via-gray-500 to-mexico-red">México!</span>
            </h1>
            <p class="text-gray-600">Presiona el botón para enviar tu Grito a la nube mediante AWS Serverless.</p>
        </div>

        <!-- Countdown -->
        <div class="flex justify-center gap-2 sm:gap-4 mb-8">
            <div class="flex flex-col items-center">
                <div class="bg-gray-100 rounded-xl p-3 w-16 sm:w-20 shadow-inner border border-gray-200 text-2xl sm:text-3xl font-bold text-gray-800 tabular-nums flex items-center justify-center" id="cd-days">00</div>
                <span class="text-[10px] sm:text-xs text-gray-500 font-bold mt-1 uppercase tracking-wider">Días</span>
            </div>
            <div class="text-2xl font-bold text-gray-400 mt-2 sm:mt-3">:</div>
            <div class="flex flex-col items-center">
                <div class="bg-gray-100 rounded-xl p-3 w-16 sm:w-20 shadow-inner border border-gray-200 text-2xl sm:text-3xl font-bold text-gray-800 tabular-nums flex items-center justify-center" id="cd-hours">00</div>
                <span class="text-[10px] sm:text-xs text-gray-500 font-bold mt-1 uppercase tracking-wider">Horas</span>
            </div>
            <div class="text-2xl font-bold text-gray-400 mt-2 sm:mt-3">:</div>
            <div class="flex flex-col items-center">
                <div class="bg-gray-100 rounded-xl p-3 w-16 sm:w-20 shadow-inner border border-gray-200 text-2xl sm:text-3xl font-bold text-gray-800 tabular-nums flex items-center justify-center" id="cd-minutes">00</div>
                <span class="text-[10px] sm:text-xs text-gray-500 font-bold mt-1 uppercase tracking-wider">Min</span>
            </div>
            <div class="text-2xl font-bold text-gray-400 mt-2 sm:mt-3">:</div>
            <div class="flex flex-col items-center">
                <div class="bg-gray-100 rounded-xl p-3 w-16 sm:w-20 shadow-inner border border-mexico-green text-2xl sm:text-3xl font-bold text-mexico-green tabular-nums flex items-center justify-center" id="cd-seconds">00</div>
                <span class="text-[10px] sm:text-xs text-mexico-green font-bold mt-1 uppercase tracking-wider">Seg</span>
            </div>
        </div>

        <button id="gritoBtn" class="btn-grito relative w-full sm:w-auto px-12 py-6 rounded-full text-white text-2xl font-bold uppercase tracking-wider mb-10 overflow-hidden group focus:outline-none focus:ring-4 focus:ring-red-300">
            <span class="relative z-10 flex items-center justify-center gap-2" id="btnText">
                ¡Dar el Grito!
                <svg id="btnIcon" class="w-6 h-6 animate-pulse-slow" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
            </span>
            <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
        </button>

        <div class="bg-gray-50 rounded-2xl p-6 border border-gray-100">
            <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Gritos Virtuales Registrados</p>
            <div class="flex items-center justify-center gap-3">
                <span id="counter" class="text-5xl font-black text-gray-800 tabular-nums">0</span>
            </div>
            <p id="loadingText" class="text-xs text-mexico-green mt-2 h-4 opacity-0 transition-opacity">Sincronizando con DynamoDB...</p>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 text-sm text-gray-500">
            <div class="flex items-center gap-1">
                <a href="https://github.com/codebypablo" target="_blank" rel="noopener noreferrer" class="font-bold text-mexico-green hover:underline hover:text-mexico-red transition-colors">Code by Pablo</a>
            </div>
            <span class="hidden sm:inline">|</span>
            <div class="flex items-center gap-1">
                <span>Powered by</span>
                <span class="font-bold text-gray-700">AWS Lambda & DynamoDB</span>
                <span>🚀</span>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 z-50">
        <span id="toastIcon">✅</span>
        <span id="toastMessage" class="text-sm font-medium">¡Evento registrado con éxito!</span>
    </div>

    <script>
        const gritoBtn = document.getElementById('gritoBtn');
        const counterEl = document.getElementById('counter');
        const loadingText = document.getElementById('loadingText');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        const btnText = document.getElementById('btnText');

        // ! REEMPLAZA CON TU URL FINAL DE API GATEWAY !
        const AWS_API_URL = 'https://0wvh5oowag.execute-api.us-east-1.amazonaws.com/grito'; 

        let count = 0;
        const COOLDOWN_SECONDS = 30; // Tiempo de espera entre clics

        async function fetchInitialCount() {
            if (!AWS_API_URL || AWS_API_URL.includes('TU_API_ID')) return;
            try {
                const response = await fetch(AWS_API_URL);
                if (response.ok) {
                    const data = await response.json();
                    count = data.total || 0;
                    counterEl.textContent = count;
                }
            } catch (error) {
                console.error("Error obteniendo contador:", error);
            }
        }
        
        fetchInitialCount();

        async function sendGritoToAWS() {
            try {
                const response = await fetch(AWS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: "el_grito", timestamp: new Date().toISOString() })
                });
                
                if (response.status === 429) {
                    throw new Error("¡Demasiados gritos al mismo tiempo! Trata en unos segundos.");
                }
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            let targetDate = new Date(targetYear, 8, 15, 23, 0, 0); 
            if (now > targetDate) {
                targetYear++;
                targetDate = new Date(targetYear, 8, 15, 23, 0, 0);
            }
            const diff = targetDate - now;
            document.getElementById('cd-days').textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            document.getElementById('cd-minutes').textContent = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
            document.getElementById('cd-seconds').textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        async function playMariachiSound() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 1 }
                }).toDestination();
                synth.volume.value = -6;
                const now = Tone.now();
                synth.triggerAttackRelease("G4", "8n", now);
                synth.triggerAttackRelease("G4", "8n", now + 0.15);
                synth.triggerAttackRelease("C5", "2n", now + 0.3);
                synth.triggerAttackRelease(["E5", "G5"], "2n", now + 0.5);
            } catch (error) { console.log("Audio desactivado"); }
        }

        function fireFestiveConfetti() {
            const defaults = { origin: { y: 0.7 }, colors: ['#006847', '#FFFFFF', '#CE1126'] };
            function fire(particleRatio, opts) { confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(200 * particleRatio) })); }
            fire(0.25, { spread: 26, startVelocity: 55 }); fire(0.2, { spread: 60 }); fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        }

        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toastIcon.textContent = type === 'success' ? '✅' : '⚠️';
            toast.classList.replace(type === 'error' ? 'bg-gray-900' : 'bg-mexico-red', type === 'error' ? 'bg-mexico-red' : 'bg-gray-900');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        gritoBtn.addEventListener('click', async () => {
            // CAPA DE SEGURIDAD 1: Validación Frontend (Cooldown de 30 segundos)
            const lastGrito = localStorage.getItem('lastGritoTime');
            const now = new Date().getTime();
            
            if (lastGrito && (now - parseInt(lastGrito)) < (COOLDOWN_SECONDS * 1000)) {
                const remaining = Math.ceil((COOLDOWN_SECONDS * 1000 - (now - parseInt(lastGrito))) / 1000);
                showToast(`¡Guarda aire! Espera ${remaining} segundos para volver a gritar.`, 'error');
                return;
            }

            gritoBtn.disabled = true;
            gritoBtn.classList.add('opacity-80', 'cursor-not-allowed');
            loadingText.classList.remove('opacity-0');

            const result = await sendGritoToAWS();

            if (result.success) {
                // Registrar el tiempo del clic exitoso en el navegador
                localStorage.setItem('lastGritoTime', new Date().getTime());
                
                playMariachiSound();
                fireFestiveConfetti();
                
                count = result.data.total;
                counterEl.style.transform = 'scale(1.5)';
                counterEl.style.color = '#006847';
                counterEl.textContent = count;
                setTimeout(() => {
                    counterEl.style.transform = 'scale(1)';
                    counterEl.style.color = '#1f2937';
                }, 300);

                showToast('¡Grito enviado a la base de datos! ¡Viva México!');
            } else {
                showToast(result.error || 'Error al conectar con AWS.', 'error');
            }

            loadingText.classList.add('opacity-0');
            gritoBtn.disabled = false;
            gritoBtn.classList.remove('opacity-80', 'cursor-not-allowed');
        });
    </script>
</body>
</html>
